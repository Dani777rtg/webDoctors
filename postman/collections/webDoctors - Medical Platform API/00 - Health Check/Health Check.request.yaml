$kind: http-request
url: "{{base_url}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Service is UP', () => {
        const json = pm.response.json();
        pm.expect(json.status).to.eql('UP');
      });
    language: text/javascript
order: 1000
