$kind: http-request
url: "{{base_url}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient_token}}
body:
  type: text
  content: |-
    {
      "doctorId": 1,
      "appointmentDate": "2026-04-10",
      "startTime": "09:00",
      "appointmentType": "GENERAL",
      "patientNotes": "Consulta general de prueba"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 Created', () => pm.response.to.have.status(201));

      if (pm.response.code === 201) {
        const json = pm.response.json();
        if (json.id) {
          pm.collectionVariables.set('appointment_id', json.id);
        }
      }
    language: text/javascript
order: 1000
