$kind: http-request
url: "{{base_url}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "doctorId": 1,
      "appointmentDate": "2026-04-10",
      "startTime": "09:00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401/403 sin token', () => {
        pm.expect(pm.response.code).to.be.oneOf([401, 403]);
      });
    language: text/javascript
order: 5000
