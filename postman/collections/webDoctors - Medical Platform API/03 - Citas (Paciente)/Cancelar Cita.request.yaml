$kind: http-request
url: "{{base_url}}/api/appointments/{{appointment_id}}/cancel"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient_token}}
body:
  type: text
  content: |-
    {
      "reason": "Ya no puedo asistir - prueba Postman"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
