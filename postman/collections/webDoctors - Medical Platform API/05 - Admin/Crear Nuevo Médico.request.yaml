$kind: http-request
url: "{{base_url}}/api/admin/doctors"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{admin_token}}
body:
  type: text
  content: |-
    {
      "email": "nuevo_doctor@hospital.com",
      "password": "Password123!",
      "firstName": "Maria",
      "lastName": "Garcia",
      "specialty": "Cardiologia",
      "phone": "3009876543"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 4000
