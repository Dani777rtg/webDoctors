$kind: http-request
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "test_short@correo.com",
      "password": "123",
      "firstName": "Test",
      "lastName": "User"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400 - Contraseña muy corta', () =>
      pm.response.to.have.status(400));
    language: text/javascript
order: 7000
