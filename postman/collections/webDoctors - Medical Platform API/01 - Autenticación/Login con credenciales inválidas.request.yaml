$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "noexiste@correo.com",
      "password": "wrongpassword"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 5000
