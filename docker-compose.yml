  #     db:
  #       condition: service_healthy

  # ------------------------------------------------------------------
  # Frontend React (descomentar cuando esté implementado)
  # ------------------------------------------------------------------
  # frontend:
  #   build: ./frontend
  #   container_name: medical_frontend
  #   environment:
  #     REACT_APP_API_URL: http://localhost:8080/api
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  pgdata:
    driver: local
